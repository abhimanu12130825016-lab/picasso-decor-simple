<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Architectural 3D fluted and louver wall panel study">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="55%" stop-color="#08131d"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="72%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#00A6D6" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#007BA7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050609" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roseGlow" cx="24%" cy="76%" r="44%">
      <stop offset="0%" stop-color="#FF2F86" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#050609" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c221c"/>
      <stop offset="45%" stop-color="#523c30"/>
      <stop offset="100%" stop-color="#191310"/>
    </linearGradient>
    <linearGradient id="slateRib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b151e"/>
      <stop offset="50%" stop-color="#182c3d"/>
      <stop offset="100%" stop-color="#060c12"/>
    </linearGradient>
    <linearGradient id="accentStrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00A6D6"/>
      <stop offset="50%" stop-color="#007BA7"/>
      <stop offset="100%" stop-color="#FF2F86"/>
    </linearGradient>
    <pattern id="walnutPattern" width="52" height="540" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="34" height="540" fill="url(#ribFront)"/>
      <rect x="34" y="0" width="18" height="540" fill="#0d0a09"/>
      <line x1="2" y1="0" x2="2" y2="540" stroke="#d29c74" stroke-opacity="0.4" stroke-width="1.5"/>
    </pattern>
    <pattern id="slatePattern" width="30" height="540" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="21" height="540" fill="url(#slateRib)"/>
      <rect x="21" y="0" width="9" height="540" fill="#04080c"/>
      <line x1="1" y1="0" x2="1" y2="540" stroke="#00A6D6" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="14" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#cyanGlow)"/>
  <rect width="1200" height="900" fill="url(#roseGlow)"/>

  <g stroke="#007BA7" stroke-opacity="0.14" stroke-width="1">
    <line x1="90" y1="110" x2="1110" y2="110"/>
    <line x1="90" y1="790" x2="1110" y2="790"/>
    <line x1="120" y1="80" x2="120" y2="820"/>
    <line x1="1080" y1="80" x2="1080" y2="820"/>
  </g>

  <g filter="url(#softShadow)" transform="translate(175,130) skewY(-4)">
    <rect x="0" y="0" width="820" height="600" fill="#070c12" stroke="#00A6D6" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="18" y="18" width="784" height="564" fill="#04070b" stroke="#007BA7" stroke-opacity="0.3"/>

    <rect x="44" y="34" width="6" height="532" fill="url(#accentStrip)" opacity="0.9"/>
    <rect x="50" y="34" width="26" height="532" fill="#00A6D6" opacity="0.14"/>

    <rect x="76" y="34" width="356" height="532" fill="url(#walnutPattern)"/>
    <rect x="448" y="34" width="4" height="532" fill="#FF2F86" opacity="0.85"/>
    <rect x="470" y="34" width="322" height="532" fill="url(#slatePattern)"/>

    <polygon points="820,0 848,18 848,618 820,600" fill="#0d1720" stroke="#00A6D6" stroke-opacity="0.5"/>
  </g>

  <g transform="translate(120,765)" font-family="monospace" font-size="15" fill="#00A6D6" letter-spacing="2">
    <text x="0" y="0">PROFILE // LINEAR FLUTED LOUVER · 12–18MM RELIEF</text>
    <text x="690" y="0" fill="#FF2F86">WPC / CHARCOAL SERIES</text>
  </g>
</svg>
